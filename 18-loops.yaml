- name: install packages
  hosts: local
  connection: local
  become: yes

  vars:
    packages:
      - { name: 'nginx', state: 'absent' }
      - { name: 'mysql', state: 'present' }
      - { name: 'git', state: 'absent' }
      - { name: 'n-tools', state: 'present' }
      - { name: 'htop', state: 'absent' }

  tasks:
  - name: install each package
    package: 
      name: "{{ item.name }}" 
      state: "{{ item.state }}"   
    loop: "{{ packages }}"  

    