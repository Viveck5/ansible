- name: print OS is RedHat or not
  hosts: local
  connection: local

  tasks:
  - name: install nginx on RedHat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"

  - name: install nginx on Debian
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"

